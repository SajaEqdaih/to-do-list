<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخطط الإنجاز 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <div class="app">
            <header class="header">
                <div>
                    <h1>مخطط الإنجاز</h1>
                    <p class="subtitle">نظّم مهامك وسيطر على يومك بذكاء</p>
                </div>
                <button id="themeToggle">🌙</button>
            </header>

            <section class="stats">
                <div class="stat"><span>كل المهام</span><strong id="totalTasks">0</strong></div>
                <div class="stat"><span>المكتملة</span><strong id="completedTasks">0</strong></div>
                <div class="stat"><span>الغير مكتملة</span><strong id="remainingTasks">0</strong></div>
            </section>

            <section class="progress-section">
                <div class="progress-head"><span>نسبة الإنجاز</span><span id="progressText">0%</span></div>
                <div class="progress-bar"><div id="progressFill"></div></div>
            </section>

            <section class="add-box">
                <div class="add-row">
                    <input id="taskInput" placeholder="ما هو هدفك القادم؟">
                    <button id="addBtn">إضافة هدف</button>
                </div>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">الكل</button>
                    <button class="filter-btn" data-filter="completed">المكتملة</button>
                    <button class="filter-btn" data-filter="pending"> الغير مكتملة</button>
                </div>
            </section>

            <ul id="taskList"></ul>

            <footer class="actions-footer">
                <button id="clearCompletedBtn">حذف المكتمل</button>
                <button id="clearAllBtn" class="danger">تصفير اللوحة</button>
            </footer>

            <footer class="brand-footer">
                تم التطوير بواسطة المهندسة <span>سجى</span> 💻
            </footer>
        </div>
    </main>
    <div id="toast">تم الإنجاز بنجاح 🎉</div>
    <script src="script.js"></script>
</body>
</html>
